  '@ai-sdk/google': 4.0.93
  '@aparajita/capacitor-secure-storage': 8.0.1
  '@blocknote/core': 0.56.0
  '@blocknote/react': 0.56.0
  '@blocknote/shadcn': 0.56.0
  '@capacitor-community/file-opener': 8.0.1
  '@capacitor/android': 8.5.3
  '@capacitor/app-launcher': 8.0.1
  '@capacitor/cli': 8.5.3
  '@capacitor/core': 8.5.3
  '@capacitor/filesystem': 8.1.4
  '@capacitor/preferences': 8.0.1
  '@capawesome/capacitor-file-picker': 8.1.0
  '@emoji-mart/data': ^1.2.1
  '@fontsource-variable/inter': ^5.3.0
  '@noble/hashes': ^2.4.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.104.5
  '@tanstack/react-table': ^8.21.3
  '@tanstack/react-virtual': 3.14.14
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  ai: 7.0.137
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  electron: 44.9.3
  electron-builder: 26.17.0
  fast-check: ^4.10.2
  kysely: ^0.29.7
  lucide-react: ^1.61.0
  mime: ^4.1.0
  playwright: ^1.64.1
  radix-ui: ^1.8.1
  react-dom: ^19.3.1
  react: ^19.3.1
  shadcn: 4.22.1
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite-plus: 1.4.0
  zod: ^4.6.5

# Vite+ ships its own Vite core and pins Vitest - every other consumer
# (Vitest's peers, plugins) gets the same copies, see Vite+'s
# "Vite and Overrides" migration rules.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5

# The Vite+ core carries its own version number (not Vite's), which
# Vitest's `vite` peer range doesn't know.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0
