packages:
  - apps/*
  - packages/*
  - plugins/*

# Shared versions - members refer to them as "catalog:".
catalogMode: prefer

catalog:
  '@ai-sdk/anthropic': 4.0.90
  '@ai-sdk/google': 4.0.107
  '@blocknote/core': 0.56.0
  '@blocknote/react': 0.56.0
  '@blocknote/shadcn': 0.56.0
  '@emoji-mart/data': ^1.2.1
  '@fontsource-variable/inter': ^5.3.0
  '@noble/hashes': ^2.4.0
  '@tailwindcss/vite': ^4.3.3
  '@tanstack/react-query': ^5.105.0
  '@tanstack/react-table': ^9.3.1
  '@tanstack/react-virtual': 3.14.23
  '@tauri-apps/api': 2.12.4
  '@tauri-apps/cli': 2.12.4
  '@tauri-apps/plugin-dialog': 2.8.3
  '@tauri-apps/plugin-fs': 2.7.1
  '@tauri-apps/plugin-http': 2.8.3
  '@tauri-apps/plugin-opener': 2.7.2
  '@tauri-apps/plugin-os': 2.4.0
  '@tauri-apps/plugin-store': 2.5.0
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  ai: 7.0.155
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  fast-check: ^4.10.2
  kysely: ^0.29.7
  lucide-react: ^1.62.0
  mime: ^4.1.2
  playwright: ^1.64.1
  radix-ui: ^1.8.1
  react-dom: ^19.3.1
  react: ^19.3.1
  shadcn: 4.23.0
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  valibot: ^1.5.0
  vite-plus: 1.4.0
  webdriverio: 10.1.0
  zod: ^4.6.5

# Vite+ ships its own Vite core and pins Vitest - every other consumer
# (Vitest's peers, plugins) gets the same copies, see Vite+'s
# "Vite and Overrides" migration rules.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: 5.0.5

# The Vite+ core carries its own version number (not Vite's), which
# Vitest's `vite` peer range doesn't know.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0

# webdriverio's optional browser drivers - the smoke test uses tauri-driver.
allowBuilds:
  edgedriver: false
  geckodriver: false
