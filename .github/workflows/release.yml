name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match required format vX.Y.Z+N"
            exit 1
          fi
          echo "build_name=${TAG%+*}" >> "$GITHUB_OUTPUT"
          echo "build_number=${TAG##*+}" >> "$GITHUB_OUTPUT"
          echo "full_version=$TAG" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: resolve-version
    strategy:
      # A failing macOS build mustn't cancel the Linux one.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: appimage
            suffix: linux-x86_64.AppImage
          # Unsigned like the Flutter app's builds - optional, see the release job.
          - os: macos-latest
            bundle: dmg
            suffix: macos-aarch64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri's system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm rust

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the app's page too. The Drive sync's "Desktop app" OAuth client is bundled into the page, see
      # packages/crdt-file-sync-google-drive/README.md.
      - name: Build and package
        env:
          DRIVE_DESKTOP_CLIENT_ID: ${{ secrets.DRIVE_DESKTOP_CLIENT_ID }}
          DRIVE_DESKTOP_CLIENT_SECRET: ${{ secrets.DRIVE_DESKTOP_CLIENT_SECRET }}
          VERSION: ${{ needs.resolve-version.outputs.build_name }}
        run: >
          pnpm --dir apps/shell exec tauri build --bundles ${{ matrix.bundle }}
          --config "{\"version\": \"$VERSION\"}"

      - name: Name the package
        env:
          VERSION: ${{ needs.resolve-version.outputs.build_name }}
        run: |
          mkdir dist
          mv apps/shell/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle == 'dmg' && 'dmg' || 'AppImage' }} \
            "dist/turtle-base-$VERSION-${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Rust with the Android targets (see mise.toml).
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm rust

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/shell/src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # The version as Gradle properties, see apps/shell/src-tauri/gen/android/app/build.gradle.kts.
      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_versionCode: ${{ needs.resolve-version.outputs.build_number }}
          ORG_GRADLE_PROJECT_versionName: ${{ needs.resolve-version.outputs.build_name }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm --dir apps/shell exec tauri android build --apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/shell/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if-no-files-found: error

  release:
    needs: [resolve-version, build-desktop, build-android]
    # Published once Linux and Android are built; the macOS build is added when it succeeded.
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.full_version }}
        run: |
          ls artifacts/*.AppImage > /dev/null || { echo "::error::No Linux build"; exit 1; }
          mv artifacts/app-universal-release.apk "artifacts/turtle-base-${VERSION}-android.apk"
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
