name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match required format vX.Y.Z+N"
            exit 1
          fi
          echo "build_name=${TAG%+*}" >> "$GITHUB_OUTPUT"
          echo "build_number=${TAG##*+}" >> "$GITHUB_OUTPUT"
          echo "full_version=$TAG" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: resolve-version
    strategy:
      # A failing macOS build mustn't cancel the Linux one.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          # Unsigned like the Flutter app's builds - optional, see the release job.
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm --dir apps/turtle-base exec vp build

      # The Drive sync's "Desktop app" OAuth client is bundled into the main process, see
      # packages/crdt-file-sync-google-drive/README.md.
      - name: Build the shell
        env:
          DRIVE_DESKTOP_CLIENT_ID: ${{ secrets.DRIVE_DESKTOP_CLIENT_ID }}
          DRIVE_DESKTOP_CLIENT_SECRET: ${{ secrets.DRIVE_DESKTOP_CLIENT_SECRET }}
        run: pnpm --dir apps/desktop exec vp pack

      - name: Package
        working-directory: apps/desktop
        run: >
          pnpm exec electron-builder ${{ matrix.target }} --publish never
          --config.extraMetadata.version=${{ needs.resolve-version.outputs.build_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
          if-no-files-found: error

  build-android:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app into the Android project
        run: |
          pnpm --dir apps/turtle-base exec vp build
          pnpm --dir apps/mobile exec cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/release.keystore
          cat > apps/mobile/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: apps/mobile/android
        run: >
          ./gradlew assembleRelease
          -PversionCode=${{ needs.resolve-version.outputs.build_number }}
          -PversionName=${{ needs.resolve-version.outputs.build_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: [resolve-version, build-desktop, build-android]
    # Published once Linux and Android are built; the macOS build is added when it succeeded.
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.full_version }}
        run: |
          ls artifacts/*.AppImage > /dev/null || { echo "::error::No Linux build"; exit 1; }
          mv artifacts/app-release.apk "artifacts/turtle-base-${VERSION}-android.apk"
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
