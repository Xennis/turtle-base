name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Tauri shell's lint compiles Tauri, which links WebKitGTK.
      - name: Install Tauri's system packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev

      # Only what the checks need.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: mise run check

      - name: Test
        run: mise run test
