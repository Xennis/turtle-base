name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ts-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only what the checks need - not e.g. OpenTofu.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint and types
        run: mise run ts-check

      - name: Test
        run: mise run ts-test
