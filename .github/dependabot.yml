version: 2

multi-ecosystem-groups:
  other:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-development:
        dependency-type: development
        patterns: ['*']
      npm-production:
        dependency-type: production
        patterns: ['*']
    ignore:
      # v9 is a rewrite of the API; migrating needs its own change
      - dependency-name: '@tanstack/react-table'
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /apps/shell/src-tauri
    patterns: ['*']
    multi-ecosystem-group: other

  - package-ecosystem: gradle
    directory: /apps/shell/src-tauri/gen/android
    patterns: ['*']
    multi-ecosystem-group: other

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: other
