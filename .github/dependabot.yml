version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-development:
        dependency-type: development
        patterns: ['*']
      npm-production:
        dependency-type: production
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /apps/shell/src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /apps/shell/src-tauri/gen/android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
