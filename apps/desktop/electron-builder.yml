# Packages the built shell (vp pack) with the built renderer (apps/turtle-base: vp build).
appId: org.xennis.apps.turtlebase
productName: turtle-base
directories:
  output: release
  buildResources: resources
# Everything is bundled into dist/ - no node_modules in the app.
files:
  - dist/**
  - resources/icon.png
  - package.json
extraResources:
  - from: ../turtle-base/dist
    to: renderer
npmRebuild: false
linux:
  target: AppImage
  executableName: turtle-base
  # Window and .desktop entry matched by name (package.json's desktopName).
  syncDesktopName: true
  category: Office
  artifactName: turtle-base-${version}-linux-${arch}.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
  # Unsigned for now, like the Flutter app's builds.
  identity: null
  artifactName: turtle-base-${version}-macos-${arch}.${ext}
