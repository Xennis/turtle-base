[tools]
node = "24.22.1"
opentofu = "1.12.0"
pnpm = "12.15.0"

[tasks.install]
description = "Install the dependencies of the workspace"
run = "pnpm install"

[tasks.check]
description = "Format check, lint and type check the workspace (Vite+) - used by CI"
run = "pnpm exec vp check"

[tasks.fix]
description = "Format the workspace and apply lint autofixes (Vite+)"
run = "pnpm exec vp check --fix"

[tasks.test]
description = "Run the tests of the workspace (Vite+)"
run = "pnpm exec vp test"

[tasks.run-desktop]
description = "Build the app and start it in Electron (Linux, macOS)"
run = """
set -e
pnpm --dir apps/turtle-base exec vp build
pnpm --dir apps/desktop exec vp pack
pnpm --dir apps/desktop exec electron .
"""

[tasks.dev-desktop]
description = "Start the app in Electron with the renderer from Vite's dev server (hot reload)"
run = """
set -e
pnpm --dir apps/desktop exec vp pack
pnpm --dir apps/turtle-base exec vp dev --port 5173 --strictPort &
trap 'kill $!' EXIT
until curl -sf http://localhost:5173/ >/dev/null; do sleep 0.2; done
TURTLE_DEV_SERVER_URL=http://localhost:5173/ pnpm --dir apps/desktop exec electron .
"""

[tasks.desktop-smoke]
description = "Build the app and smoke-test it in Electron (needs a display)"
run = """
set -e
pnpm --dir apps/turtle-base exec vp build
pnpm --dir apps/desktop exec vp pack
pnpm --dir apps/desktop exec vpx e2e/smoke.e2e.ts
"""

[tasks.package-desktop]
description = "Package the desktop app for this OS with electron-builder (apps/desktop/release) - unsigned, version 0.0.0"
run = """
set -e
pnpm --dir apps/turtle-base exec vp build
pnpm --dir apps/desktop exec vp pack
pnpm --dir apps/desktop exec electron-builder --publish never
"""

[tasks.run-android]
description = "Build the app and run it in the Capacitor Android shell (asks for the device)"
run = """
set -e
export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
pnpm --dir apps/turtle-base exec vp build
pnpm --dir apps/mobile exec cap run android
"""

[tasks.mobile-smoke]
description = "Build the app, install it on ANDROID_SERIAL (an emulator - its app data is cleared) and smoke-test it"
run = """
set -e
: "${ANDROID_SERIAL:?set ANDROID_SERIAL to the emulator to test on, e.g. emulator-5554}"
export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
pnpm --dir apps/turtle-base exec vp build
pnpm --dir apps/mobile exec cap sync android
(cd apps/mobile/android && ./gradlew assembleDebug -q)
"$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
pnpm --dir apps/mobile exec vpx e2e/smoke.e2e.ts
"""
