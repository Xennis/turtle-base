[tools]
node = "24.22.1"
opentofu = "1.12.0"
pnpm = "12.15.0"
# The Tauri shell (apps/shell) - with the targets of its Android build.
rust = { version = "1.99.1", components = "rustfmt,clippy", targets = "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
# Drives the desktop app for its smoke test (WebDriver, Linux).
"cargo:tauri-driver" = "2.1.0"

[tasks.install]
description = "Install the dependencies of the workspace"
run = "pnpm install"

[tasks.check]
description = "Format check, lint and type check the workspace (Vite+) and the Tauri shell (cargo) - used by CI"
run = """
set -e
pnpm exec vp check
cargo fmt --manifest-path apps/shell/src-tauri/Cargo.toml --check
cargo clippy --manifest-path apps/shell/src-tauri/Cargo.toml --all-targets -- -D warnings
"""

[tasks.fix]
description = "Format the workspace and apply lint autofixes (Vite+, cargo fmt)"
run = """
set -e
pnpm exec vp check --fix
cargo fmt --manifest-path apps/shell/src-tauri/Cargo.toml
"""

[tasks.test]
description = "Run the tests of the workspace (Vite+) and the Tauri shell (cargo)"
run = """
set -e
pnpm exec vp test
cargo test --manifest-path apps/shell/src-tauri/Cargo.toml
"""

[tasks.run-desktop]
description = "Build the app and start it in the Tauri shell (Linux, macOS - debug build)"
run = """
set -e
pnpm --dir apps/shell exec tauri build --debug --no-bundle
apps/shell/src-tauri/target/debug/turtle-base
"""

[tasks.dev-desktop]
description = "Start the app in the Tauri shell with the page from Vite's dev server (hot reload)"
run = "pnpm --dir apps/shell exec tauri dev"

[tasks.desktop-smoke]
description = "Build the app for the smoke test and smoke-test it in the Tauri shell over WebDriver (Linux, needs a display)"
run = """
set -e
TURTLE_E2E=1 DRIVE_DESKTOP_CLIENT_ID=smoke-client DRIVE_DESKTOP_CLIENT_SECRET=smoke-secret \
  pnpm --dir apps/shell exec tauri build --debug --no-bundle
pnpm --dir apps/shell exec vpx e2e/desktop-smoke.e2e.ts
"""

[tasks.package-desktop]
description = "Package the desktop app for this OS (AppImage on Linux, dmg on macOS) - unsigned, version 0.0.1"
run = "pnpm --dir apps/shell exec tauri build"

[tasks.run-android]
description = "Run the app on Android with the page from Vite's dev server (asks for the device)"
run = """
set -e
export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
export NDK_HOME=${NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}
pnpm --dir apps/shell exec tauri android dev
"""

[tasks.package-android]
description = "Build a release APK for phones (arm64) - signed with apps/shell/src-tauri/gen/android/key.properties, else the debug key"
run = """
set -e
export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
export NDK_HOME=${NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}
pnpm --dir apps/shell exec tauri android build --apk --target aarch64
echo "APK: apps/shell/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk"
"""

[tasks.mobile-smoke]
description = "Build the app for x86_64, install it on ANDROID_SERIAL (an emulator - its app data is cleared) and smoke-test it"
run = """
set -e
: "${ANDROID_SERIAL:?set ANDROID_SERIAL to the emulator to test on, e.g. emulator-5554}"
export ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
export NDK_HOME=${NDK_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}
pnpm --dir apps/shell exec tauri android build --debug --apk --target x86_64
"$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" install -r apps/shell/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
pnpm --dir apps/shell exec vpx e2e/android-smoke.e2e.ts
"""
