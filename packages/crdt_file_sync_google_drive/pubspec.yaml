name: crdt_file_sync_google_drive
description: Google Drive storage adapter for turtle-base's CRDT file sync (implements crdt_file_sync_transport).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  crdt_file_sync_transport:
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_secure_storage: ^10.3.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.3
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
