name: turtle_base_workspace
description: Workspace root of the turtle-base monorepo - holds the shared lockfile and dependency overrides.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - apps/turtle_base

# Every package here is overridden because of a real upstream
# compatibility gap, not preference. Whenever the underlying issue is
# fixed upstream, drop the override and go back to a normal hosted
# version constraint in the member pubspec.
dependency_overrides:
  # appflowy_editor pins keyboard_height_plugin ^0.1.5, whose Android
  # build.gradle hardcodes compileSdkVersion 31 - too old for
  # androidx.fragment 1.7.1 (needs 34+), which fails the Android build.
  # 0.3.0 (latest) bumped it to 34 and didn't change its (tiny) public
  # API, so overriding past appflowy_editor's caret constraint is safe.
  keyboard_height_plugin: ^0.3.0
  # sqlite_crdt (see ARCHITECTURE.md's sync section) pulls in sql_crdt,
  # which does the actual CRDT merge logic. sql_crdt has never released
  # a version supporting sqlparser >=0.42 (our drift_dev needs ^0.45.0,
  # which itself has breaking API changes vs. the ^0.41.0 sql_crdt last
  # targeted) - upstream: https://github.com/cachapa/sql_crdt. No PR
  # open there yet; this fork bumps the sqlparser constraint and fixes
  # the resulting breakage in sql_crdt's own code.
  sql_crdt:
    git:
      url: https://github.com/Xennis/sql_crdt.git
      ref: chore_sqlparser_0.45.0
  # appflowy_editor 6.2.0 (latest release on pub.dev) doesn't implement
  # TextInputClient.onFocusReceived, a method Flutter 3.44 made
  # required - without it the app fails to compile on Flutter 3.44+.
  # Points at an open upstream PR's branch until it's merged/released:
  # https://github.com/AppFlowy-IO/appflowy-editor/pull/1208
  appflowy_editor:
    git:
      url: https://github.com/onedigitalde/appflowy-editor.git
      ref: fix/flutter-3-44-on-focus-received
